[project]
name = "workbook-tasks"
version = "0.2.0"
description = "Fill a spreadsheet tab from public sources (SEC EDGAR, ECB), graded row by row by code against a frozen key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
tags = ["tool-use", "web", "spreadsheets", "eval", "multi-turn", "v1"]
dependencies = ["verifiers>=0.4.1"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbook_tasks"]
